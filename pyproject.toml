[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "virserin-exptrack_jd422"
version = "0.1.0"
description = "从样本里推断实验管理与追踪工程师·线上分布漂移的检测应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "virserin" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://virserin.github.io"
Repository = "https://github.com/virserin/exptrack_jd422"
Issues = "https://github.com/virserin/exptrack_jd422/issues"

[project.scripts]
exptrack_jd422 = "exptrack_jd422:main"

[tool.setuptools]
py-modules = ["exptrack_jd422"]
